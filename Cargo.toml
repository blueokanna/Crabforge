[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/bridge",
    "crates/runner",
    "crates/test-support",
    "crates/peer-address",
    "tools/verify",
]
resolver = "2"

[patch.crates-io]
multiaddr = { path = "crates/peer-address" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.105"
nextjson = { version = "=0.1.5", features = ["derive"] }
crabforge-core = { path = "crates/core" }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
    "io-util",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
