[workspace]
members = ["crates/core", "crates/cli", "crates/bridge", "crates/runner", "tools/verify"]
exclude = ["crates/vendor/multiaddr"]
resolver = "2"

[patch.crates-io]
multiaddr = { path = "crates/vendor/multiaddr" }

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.105"
nextjson = { version = "=0.1.5", features = ["derive"] }
axum = { version = "0.8", default-features = false, features = ["http1", "original-uri", "tokio"] }
crabforge-core = { path = "crates/core" }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
    "io-util",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
