name: crabforge_assets
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.13.7
flutter:
  assets:
    - brands/
    - crabforge.png
    - fonts/NotoSansKR-OFL.txt
    - fonts/GoogleSans-OFL.txt
    - fonts/HarmonyOS-Sans-LICENSE.txt
  fonts:
    - family: Google Sans
      fonts:
        - asset: fonts/GoogleSans-Variable.ttf
    - family: HarmonyOS Sans SC
      fonts:
        - asset: fonts/HarmonyOS_SansSC-Variable.ttf
    - family: Noto Sans KR
      fonts:
        - asset: fonts/NotoSansKR-Variable.ttf
