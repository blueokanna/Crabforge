name: crabforge_assets
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.13.7
flutter:
  assets:
    - crabforge.png
    - fonts/NotoSansKR-OFL.txt
  fonts:
    - family: Google Sans
      fonts:
        - asset: fonts/GoogleSans-Variable.ttf
    - family: HarmonyOS Sans SC
      fonts:
        - asset: fonts/HarmonyOS_SansSC_Regular.ttf
          weight: 400
        - asset: fonts/HarmonyOS_SansSC_Medium.ttf
          weight: 500
        - asset: fonts/HarmonyOS_SansSC_Bold.ttf
          weight: 700
    - family: Noto Sans KR
      fonts:
        - asset: fonts/NotoSansKR-Variable.ttf
