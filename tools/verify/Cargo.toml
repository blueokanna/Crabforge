[package]
name = "crabforge-verify"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.13.5", default-features = false }
serde_json = "1"
tempfile = "3"
tokio = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
