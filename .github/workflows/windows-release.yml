name: Windows release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-windows-release
  cancel-in-progress: false

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release version and source
        id: version
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -cne "refs/heads/$env:DEFAULT_BRANCH") {
            throw 'Run a manual release from the default branch.'
          }
          $commit = git rev-parse HEAD
          git merge-base --is-ancestor $commit "refs/remotes/origin/$env:DEFAULT_BRANCH"
          $versionPattern = '(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)'
          $flutter = [regex]::Match((Get-Content gui/pubspec.yaml -Raw), "(?m)^version: ($versionPattern)\+([1-9][0-9]*)$")
          if (!$flutter.Success) { throw 'Expected a stable version and positive build number in gui/pubspec.yaml.' }
          $version, $build = $flutter.Groups[1].Value, $flutter.Groups[2].Value
          $rust = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^\[workspace\.package\]\n(?:[^\[\n].*\n)*?version = "([^"]+)"$')
          $assets = [regex]::Match((Get-Content assets/pubspec.yaml -Raw), '(?m)^version: (\S+)$')
          if ($rust.Groups[1].Value -cne $version -or $assets.Groups[1].Value -cne $version) {
            throw 'Flutter, Rust, and asset package versions must agree.'
          }
          $tag = if ($build -eq '1') { "v$version" } else { "v$version+$build" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne $tag) {
            throw "The release tag must match $tag."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

  build:
    needs: identify
    uses: ./.github/workflows/windows-build.yml
    with:
      revision: ${{ needs.identify.outputs.commit }}

  package:
    needs: [identify, build]
    runs-on: windows-2025
    timeout-minutes: 25
    environment: windows-release
    outputs:
      authenticode: ${{ steps.package.outputs.authenticode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.identify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: crabforge-windows-x64-ci
          path: ${{ runner.temp }}/crabforge-unsigned
      - name: Package the Windows build
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.identify.outputs.tag }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERT_THUMBPRINT }}
        run: |
          $hasSigningMaterial = $env:WINDOWS_SIGNING_PFX_BASE64 -or `
            $env:WINDOWS_SIGNING_PFX_PASSWORD -or $env:WINDOWS_SIGNING_CERT_THUMBPRINT
          $authenticode = $hasSigningMaterial -or ($env:WINDOWS_SIGNING_REQUIRED -eq 'true')
          ./.github/scripts/sign-windows.ps1 `
            -Package (Join-Path $env:RUNNER_TEMP 'crabforge-unsigned') `
            -Output (Join-Path $env:RUNNER_TEMP 'crabforge-release') `
            -Tag $env:RELEASE_TAG -Authenticode:$authenticode
          "authenticode=$($authenticode.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crabforge-windows-x64-release
          path: ${{ runner.temp }}/crabforge-release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest:
    needs: [identify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: crabforge-windows-x64-release
          path: ${{ runner.temp }}/crabforge-release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/crabforge-release/crabforge-*-windows-x64.zip

  publish:
    needs: [identify, package, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: crabforge-windows-x64-release
          path: ${{ runner.temp }}/crabforge-release
      - name: Publish the verified archive to GitHub Releases
        shell: bash
        working-directory: ${{ runner.temp }}/crabforge-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.identify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.identify.outputs.commit }}
          RELEASE_AUTHENTICODE: ${{ needs.package.outputs.authenticode }}
        run: |
          set -euo pipefail
          archive="crabforge-${RELEASE_TAG#v}-windows-x64.zip"
          sha256sum --check --strict "$archive.sha256"
          gh attestation verify "$archive" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/windows-release.yml" \
            --source-digest "$RELEASE_COMMIT" --deny-self-hosted-runners
          if ! gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --silent; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_COMMIT" --silent
          fi
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"

          marker="<!-- crabforge-release-run:$GITHUB_RUN_ID commit:$RELEASE_COMMIT -->"
          case "$RELEASE_AUTHENTICODE" in
            true) signature='The EXEs and DLLs include timestamped Authenticode publisher signatures.' ;;
            false) signature='This build was packaged without an Authenticode publisher signature.' ;;
            *) exit 1 ;;
          esac
          if state=$(gh release view "$RELEASE_TAG" --json isDraft,body); then
            jq -e --arg marker "$marker" '.isDraft and (.body | contains($marker))' <<<"$state" >/dev/null
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Crabforge $RELEASE_TAG" \
              --notes "Windows x64 portable package with GitHub build provenance. Verify the archive against the attached SHA-256 checksum and the repository's artifact attestation. $signature

          $marker"
          fi
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --clobber
          assets=$(gh api "repos/$GH_REPO/releases" --paginate | jq -r --arg tag "$RELEASE_TAG" \
            '.[] | select(.tag_name == $tag) | .assets[] | [.name, .state, .digest] | @tsv')
          for asset in "$archive" "$archive.sha256"; do
            digest=$(sha256sum "$asset" | cut -d ' ' -f 1)
            grep -Fxq "$(printf '%s\tuploaded\tsha256:%s' "$asset" "$digest")" <<<"$assets"
          done
          gh release edit "$RELEASE_TAG" --draft=false
