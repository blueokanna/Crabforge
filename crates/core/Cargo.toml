[package]
name = "crabforge-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
aws-credential-types = "1.3.1"
aws-sigv4 = "1.6.6"
http-body-util = "0.1"
base64 = "0.23"
percent-encoding = "2"
url = "2"
ring = "0.17"
rustls-pki-types = "1"
tokio = { workspace = true, features = ["process"] }
courierust = "=1.1.3"
nextjson.workspace = true
recurse-x = { version = "=0.2.6", default-features = false }
rustbinary = { version = "=0.1.10", default-features = false }
libp2p = { version = "=0.57.1", features = [
    "ed25519",
    "tokio",
    "quic",
    "relay",
    "tls",
    "yamux",
    "identify",
    "dcutr",
    "macros",
] }
libp2p-stream = "0.5.0-alpha"
tokio-util = { version = "0.7", features = ["compat", "rt"] }
axum.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "stream",
    "multipart",
] }
multer = "3.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
semver = "1"
yaml-edit = { version = "0.3.6", default-features = false }
subtle = "2"
tempfile = "3"
open = "5"
futures-util = "0.3"
fancy-regex = "0.16.2"
glob = "0.3.4"
regex = "1"
async-stream = "0.3"
getrandom = "0.4"
flutter_rust_bridge = { version = "2.13" }

sha2 = "0.11"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
serde_json = "1"
axum = { workspace = true, features = ["json"] }
aws-lc-rs = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }

[build-dependencies]
flate2 = "1"
nextjson.workspace = true
