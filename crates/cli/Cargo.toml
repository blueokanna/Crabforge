[package]
name = "crabforge-cli"
default-run = "crabforge-cli"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
nextjson.workspace = true
tokio.workspace = true
crabforge-core.workspace = true
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
tempfile = "3"
toml_edit = "0.25"

[dev-dependencies]
saphyr = { version = "0.4.1", default-features = false }
futures-util = "0.3"
crabforge-test-support = { path = "../test-support" }
