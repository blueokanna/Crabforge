[package]
name = "crabforge-cli"
default-run = "crabforge-cli"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
nextjson.workspace = true
tokio.workspace = true
crabforge-core.workspace = true
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
tempfile = "3"
toml_edit = "0.25"

[dev-dependencies]
serde_json = "1"
saphyr = { version = "0.4.1", default-features = false }
axum = { workspace = true, features = ["json"] }
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false }
