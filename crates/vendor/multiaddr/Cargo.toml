# Based on the crates.io multiaddr 0.19.1 archive (upstream d5981da4b337d21807ee5869178fbaf3d5ec7e03).
# Crabforge uses the upstream wire and text codecs without its Serde trait implementations.
[package]
authors = ["dignifiedquire <dignifiedquire@gmail.com>", "Parity Technologies <admin@parity.io>"]
description = "Implementation of the multiaddr format"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/multiformats/rust-multiaddr"
keywords = ["multiaddr", "ipfs"]
license = "MIT"
name = "multiaddr"
version = "0.19.1"

[features]
default = ["url"]

[dependencies]
byteorder = "1.5.0"
bytes = "1.7.2"
data-encoding = "2.6.0"
multibase = "0.9.1"
multihash = "0.19"
percent-encoding = "2.3.1"
static_assertions = "1.1"
unsigned-varint = "0.8"
url = { version = "2.5.0", optional = true, default-features = false }
libp2p-identity = { version = "0.3.0", features = ["peerid"] }

[dev-dependencies]
rand = "0.9.0"

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly)'] }
