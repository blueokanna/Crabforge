[package]
name = "crabforge-runner"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com",
    "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Registry",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
